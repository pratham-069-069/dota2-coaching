services:
  # ==========================================================
  # 1. FastAPI Machine Learning REST Backend
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_PREFIX:-dota2}/backend:${IMAGE_TAG:-latest}
    container_name: dota2-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dota2-network

  # ==========================================================
  # 2. React + Vite + Nginx Frontend
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_PREFIX:-dota2}/frontend:${IMAGE_TAG:-latest}
    container_name: dota2-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dota2-network

  # ==========================================================
  # 3. Watchtower: Zero-Intervention Auto-Deployment Agent
  # Automatically detects newly pushed container images in the registry
  # and performs graceful zero-downtime rolling updates on the server.
  # ==========================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: dota2-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL:-60}
      - WATCHTOWER_INCLUDE_RESTARTING=true
    profiles:
      - autodeploy
    networks:
      - dota2-network

networks:
  dota2-network:
    name: dota2-network
    driver: bridge

