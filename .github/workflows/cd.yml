name: CD - Automated Continuous Deployment Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force automated build & publish to GHCR"
        required: false
        default: "true"

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================
  # Build and Publish Production Containers to GHCR
  # ==========================================================
  build-and-publish:
    name: Build & Push Images to GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: meta
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Repository Lowercase Name
        id: repo_name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Build & Push Backend Container
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/backend:latest
            ghcr.io/${{ env.REPO }}/backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Container
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/frontend:latest
            ghcr.io/${{ env.REPO }}/frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
